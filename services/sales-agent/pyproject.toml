[project]
name = "sales-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["chatcore", "uvicorn[standard]>=0.32", "httpx>=0.28"]

[tool.uv.sources]
chatcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_agent"]
