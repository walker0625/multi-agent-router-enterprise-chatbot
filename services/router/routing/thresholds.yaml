# L2 임계값 τ. 임베더마다 다른 값이다 — embedder 가 지금 임베더와 다르면 L2 는 skipped 가 된다.
# 초기값: 앵커를 바꿔 쓴 문장 36개(도메인당 12)와 지시어·짧은 질문 16개로 hashing-512 에서 대략 잡았다.
#   τ=0.55 에서 바꿔 쓴 문장 28/36 결정(오결정 0), 지시어·짧은 질문 결정 0/16.
# 이 수치는 초기 추정이다. 최종 값은 eval 의 calibrate-l2 가 holdout 에서 정한다.
version: 1
tau: 0.55
embedder: hashing-512
calibrated_on: "initial-guess"
