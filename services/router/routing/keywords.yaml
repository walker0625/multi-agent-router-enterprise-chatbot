# L1 키워드 규칙.
# - 각 도메인 데이터(data/)에서 그 도메인에만 나오는 고유 어휘만 넣는다.
#   "일정", "회의", "고객", "검수", "배차"처럼 두 도메인에 다 나오는 말은 넣지 않는다.
# - exact: 앞뒤가 영문·숫자가 아니어야 매칭(뒤에 한글 조사는 허용). 영문 약어·식별자용.
# - partial: 공백·대소문자를 무시한 부분 문자열.
# - 같은 키워드를 두 도메인에 넣으면 시작이 거부된다.
# v2: 복합 질문 단서를 넓혔다(골드셋 v1 dev 오답 기준). 단서는 결정을 막기만 하므로
#     넓게 잡아 틀려도 L3 호출 한 번이 늘 뿐이고, 좁게 잡아 틀리면 오답이 확정된다.
