[project]
name = "delivery-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["chatcore", "uvicorn[standard]>=0.32", "langgraph>=0.3"]

[tool.uv.sources]
chatcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_agent"]
