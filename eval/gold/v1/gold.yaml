#
# 분할: 범주마다 순서대로 번갈아 dev(짝수 번째)·test(홀수 번째). τ 보정은 dev 에서만 하고 test 로 확인한다.
# L2 앵커(services/router/routing/anchors.yaml)와 거의 같은 문장은 넣지 않는다(eval 이 실행 때 검사).
