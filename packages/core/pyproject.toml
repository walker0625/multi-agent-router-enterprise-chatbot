[project]
name = "chatcore"
version = "0.1.0"
description = "세 서비스가 공유하는 포트·이벤트 계약·인증·검색·가드"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=1.60",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatcore"]
